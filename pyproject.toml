[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uzling"
version = "0.1.0"
description = "Utilities for the open textbook 'Sun'iy intellekt lingvistikasi' (AI linguistics for Uzbek)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dilrabo Khidirova" }]
keywords = ["uzbek", "nlp", "low-resource", "turkic", "llm", "calibration", "tokenization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Uzbek",
  "Topic :: Text Processing :: Linguistic",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
notebooks = [
  "transformers>=5.0",
  "tokenizers>=0.22",
  "datasets>=4.0",
  "sentencepiece",
  "protobuf",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/dilrabonu/ai-linguistics-uz"
Issues = "https://github.com/dilrabonu/ai-linguistics-uz/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Printed book snippets are kept compact (no blank lines between defs, one import line).
"book_snippets/*" = ["E302", "E305", "E401", "I001"]
