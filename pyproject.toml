[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uzling"
version = "0.1.0"
description = "Utilities for the open textbook 'Sun'iy intellekt lingvistikasi' (AI linguistics for Uzbek)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dilrabo Khidirova" }]
keywords = ["uzbek", "nlp", "low-resource", "turkic", "llm", "calibration", "tokenization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Uzbek",
  "Topic :: Text Processing :: Linguistic",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
notebooks = ["transformers>=4.40", "datasets>=2.19", "matplotlib>=3.7", "pandas>=2.0", "scikit-learn>=1.3"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/dilrabonu/ai-linguistics-uz"
Issues = "https://github.com/dilrabonu/ai-linguistics-uz/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
